[project]
name = "streamlit-lab-profiling"
version = "0.1.0"
description = "Isolated profiling lesson; upstream does not yet support Pandas 3"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit>=1.64,<2",
    "bokeh>=3.10,<4",
    "folium>=0.20,<1",
    "streamlit-aggrid>=1.2,<2",
    "streamlit-bokeh>=3.10,<4",
    "streamlit-folium>=0.27,<1",
    "pandas>=2.3,<3",
    "plotly>=7.1,<8",
    "requests>=2.32,<3",
    "streamlit-lottie>=0.0.5,<0.1",
    "streamlit-plotly-events>=0.0.6,<0.1",
    "fg-data-profiling>=4.20,<5",
]

[tool.uv]
package = false
